<!doctype html><main class="ashby-job-posting-right-pane"><div data-field-path="_systemfield_education_history" data-field-entry-id="form__systemfield_education_history"><label class="ashby-application-form-question-title _required_fixture">Education History</label><div id="rows"></div><button type="button" class="ashby-application-form-input-education-add">+ Add Education</button></div></main>
<script>
const path='_systemfield_education_history',values=[{}],schoolCache=new Map();
async function save() {
 await fetch('/api/non-user-graphql',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({
 operationName:'ApiSetFormValue',query:window.saveQuery,variables:{organizationHostedJobsPageName:'example',
 formRenderIdentifier:'form',formDefinitionIdentifier:'definition',path,value:values}})});
}
function addRow(index) {
 const row=document.createElement('div');row.className='ashby-application-form-input-education-entry';
 row.innerHTML=`<input role="combobox" aria-controls="schools-${index}"><input id="${path}-degree"><input id="${path}-major">
 <div id="${path}-startDate"><select><option value="">Month</option>${Array.from({length:12},(_,i)=>`<option value="${i+1}">${i+1}</option>`).join('')}</select><select><option value="">Year</option>${[2010,2011,2012,2013,2014,2015,2016,2017].map(year=>`<option>${year}</option>`).join('')}</select></div>
 <div id="${path}-endDate"><select><option value="">Month</option></select><select><option value="">Year</option></select></div><input type="checkbox" id="${path}-isCurrent">`;
 document.querySelector('#rows').append(row);
 const school=row.querySelector('[role="combobox"]');school.addEventListener('input',()=>search(school,index));
 for(const part of ['degree','major']){const input=row.querySelector(`[id="${path}-${part}"]`);input.addEventListener('input',event=>{values[index][part]=event.target.value;save()});input.addEventListener('blur',save);}
 row.querySelector(`[id="${path}-isCurrent"]`).addEventListener('change',event=>{values[index].isCurrent=event.target.checked;if(event.target.checked)delete values[index].endDate;save()});
 const selects=[...row.querySelectorAll(`[id="${path}-startDate"] select`)];
 selects.forEach((select,position)=>select.addEventListener('change',()=>{
 const parts=(values[index].startDate||new Date().toISOString()).slice(0,7).split('-').map(Number);
 parts[position===1?0:1]=Number(select.value);values[index].startDate=`${parts[0]}-${String(parts[1]).padStart(2,'0')}-01`;
 selects[0].value=String(parts[1]);selects[1].value=String(parts[0]);save();
 }));
}
async function search(input,index) {
 let data=schoolCache.get(input.value);
 if(!data) {
  const response=await fetch('/api/non-user-graphql',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({
   operationName:'ApiSearchSchoolByCanonicalName',query:window.schoolQuery,variables:{name:input.value,organizationHostedJobsPageName:'example'}})});
  data=await response.json();schoolCache.set(input.value,data);
 }
 document.querySelector(`#schools-${index}`)?.remove();
 const menu=document.createElement('div');menu.id=`schools-${index}`;menu.role='listbox';
 for(const school of data.data.result) {
 const option=document.createElement('div');option.role='option';const label=document.createElement('span');label.textContent=school.name;option.append(label);
 option.onclick=()=>{values[index].canonicalSchoolId=school.id;values[index].schoolName=school.name;input.value=school.name;menu.remove();save()};menu.append(option);
 }
 document.body.append(menu);
}
addRow(0);
document.querySelector('.ashby-application-form-input-education-add').onclick=()=>{values.push({});addRow(values.length-1);save()};
</script>
