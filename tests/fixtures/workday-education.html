<!-- Fictional education panel exercising the accessibility controls that the Workday adapter reads. -->
<section role="group" aria-labelledby="Education-section">
  <h2 id="Education-section">Education</h2>
  <div role="group" aria-labelledby="Education-1-panel">
    <h3 id="Education-1-panel">Education entry</h3>
    <div data-automation-id="formField-schoolName">
      <label>School <abbr title="required">*</abbr><input name="schoolName" required></label>
    </div>
    <div data-automation-id="formField-degree">
      <button name="degree" id="degree-1" type="button" aria-haspopup="listbox">Select degree</button>
    </div>
    <div data-automation-id="formField-fieldOfStudy">
      <div data-automation-id="multiselectInputContainer">
        <label>Field of study
          <input data-uxi-widget-type="selectinput" data-uxi-multiselect-id="study-1" autocomplete="off">
        </label>
      </div>
    </div>
    <div data-automation-id="formField-gradeAverage">
      <label>Grade average<input name="gradeAverage"></label>
    </div>
    <fieldset data-automation-id="formField-firstYearAttended">
      <legend>From</legend><label>Year<input role="spinbutton" inputmode="numeric"></label>
    </fieldset>
    <fieldset data-automation-id="formField-lastYearAttended">
      <legend>To (Actual or Expected)</legend><label>Year<input role="spinbutton" inputmode="numeric"></label>
    </fieldset>
  </div>
  <button type="button" data-automation-id="add-button">Add education</button>
</section>
