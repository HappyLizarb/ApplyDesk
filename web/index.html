<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light dark"><title>ApplyDesk</title><link rel="stylesheet" href="/styles.css"><link rel="stylesheet" href="/assistant.css"><link rel="stylesheet" href="/page-layout.css"></head>
<body>
  <svg class="icon-defs" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><defs>
    <symbol id="icon-applications" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M3 10h18M9 10v10"/></symbol>
    <symbol id="icon-profile" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21v-2a8 8 0 0 1 16 0v2"/></symbol>
    <symbol id="icon-document" viewBox="0 0 24 24"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9zM14 3v6h6M8 13h8M8 17h5"/></symbol>
    <symbol id="icon-chat" viewBox="0 0 24 24"><path d="M5 4h14a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H9l-5 3v-3H3V6a2 2 0 0 1 2-2zM7 9h10M7 13h6"/></symbol>
    <symbol id="icon-settings" viewBox="0 0 24 24"><path d="M4 7h9m4 0h3M4 17h3m4 0h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/></symbol>
    <symbol id="icon-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="icon-search" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 4 4"/></symbol>
    <symbol id="icon-send" viewBox="0 0 24 24"><path d="M12 20V4m-7 7 7-7 7 7"/></symbol>
    <symbol id="icon-stop" viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" fill="currentColor" stroke="none"/></symbol>
    <symbol id="icon-arrow" viewBox="0 0 24 24"><path d="M5 12h14m-5-5 5 5-5 5"/></symbol>
    <symbol id="icon-chevron-down" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></symbol>
    <symbol id="icon-check" viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"/></symbol>
    <symbol id="icon-lock" viewBox="0 0 24 24"><rect x="5" y="10" width="14" height="11" rx="3"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></symbol>
    <symbol id="icon-close" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></symbol>
    <symbol id="icon-restart" viewBox="0 0 24 24"><path d="M3 10a9 9 0 1 1 2 8M3 4v6h6"/></symbol>
    <symbol id="icon-more" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></symbol>
  </defs></svg>
  <div class="shell">
    <aside class="sidebar">
      <nav aria-label="Main navigation">
        <button data-view="applications"><svg class="icon" aria-hidden="true"><use href="#icon-applications"></use></svg>Applications<span id="job-count" class="nav-count">0</span></button>
        <button data-view="profile"><svg class="icon" aria-hidden="true"><use href="#icon-profile"></use></svg>Profile<span id="profile-indicator" class="indicator"></span></button>
        <button data-view="documents"><svg class="icon" aria-hidden="true"><use href="#icon-document"></use></svg>Documents</button>
      </nav>
      <button type="button" id="toggle-assistant" class="assistant-toggle" aria-expanded="false" aria-controls="assistant-panel"><svg class="icon" aria-hidden="true"><use href="#icon-chat"></use></svg>Chat</button>
      <button type="button" id="quit-app" class="sidebar-bottom danger" aria-expanded="false"><svg class="icon" aria-hidden="true"><use href="#icon-close"></use></svg><span data-quit-label>Quit</span></button>
    </aside>
    <main id="main" tabindex="-1"><div class="loading">Opening your workspace…</div></main>
  </div>
  <aside id="assistant-panel" aria-label="ApplyDesk chat" hidden></aside>
  <div id="toast" role="status" aria-live="polite" hidden></div>
  <dialog id="modal"></dialog>
  <script type="module" src="/app.js"></script>
</body>
</html>
