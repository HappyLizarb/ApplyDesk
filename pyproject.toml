[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "applydesk-local"
version = "1.0.4"
description = "ApplyDesk's local macOS application service"
requires-python = ">=3.11"
dependencies = [
    "lxml>=6.1.1",
    "pdfplumber==0.11.9",
    "Pillow>=9.1",
    "cryptography",
]

[project.optional-dependencies]
test = ["python-docx==1.2.0", "reportlab==4.4.9"]

[project.scripts]
applydesk = "applydesk_desktop.run:main"

[tool.setuptools]
packages = ["applydesk", "applydesk_desktop"]
include-package-data = false

[tool.setuptools.package-dir]
applydesk_desktop = "."

[tool.setuptools.package-data]
applydesk = ["skills/workday-apply/SKILL.md"]
applydesk_desktop = ["web/*.html", "web/*.css", "web/*.js", "web/*.txt", "native/chrome-window-inventory.cjs"]
