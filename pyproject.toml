[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "applydesk-local"
version = "0.1.0"
description = "ApplyDesk's local macOS application service"
requires-python = ">=3.11"
dynamic = ["dependencies"]

[project.scripts]
applydesk = "applydesk_desktop.run:main"

[tool.setuptools]
packages = ["applydesk", "applydesk_desktop"]
include-package-data = false

[tool.setuptools.package-dir]
applydesk_desktop = "."

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.setuptools.package-data]
applydesk = ["CHAT_SKILL.md", "skills/workday-apply/SKILL.md"]
applydesk_desktop = ["web/*.html", "web/*.css", "web/*.js", "web/*.txt", "browser/*.cjs"]
